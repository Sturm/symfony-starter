name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # .env is not committed; the kernel needs it to boot
      - run: cp .env.example .env

      - uses: ramsey/composer-install@v3

      # PHPStan and Rector read the dev container XML and config/reference.php
      - run: bin/console cache:warmup --env=dev

      - run: composer lint
      - run: composer cs
      - run: composer rector
      - run: composer phpstan

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - run: composer audit --locked
