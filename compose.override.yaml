services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MAILER_DSN: smtp://mailer:1025
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: playground
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: ${XDEBUG_MODE:-develop}
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows
      - /app/var
      # Uncomment to also keep vendor/ off the bind-mount on Mac/Windows
      #- /app/vendor
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - ${POSTGRES_PORT:-5432}:5432
###< doctrine/doctrine-bundle ###

  redis:
    ports:
      - ${REDIS_PORT:-6379}:6379

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - ${MAILPIT_SMTP_PORT:-1025}:1025
      - ${MAILPIT_UI_PORT:-8025}:8025
###< symfony/mailer ###

# The Mercure hub is built into FrankenPHP; this marker stops the Flex recipe from adding a separate one
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###
